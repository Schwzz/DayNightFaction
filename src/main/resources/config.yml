damage:
  base: 1.0
  increment: 0.5
  max: 5.0
  interval-ticks: 60

safe-zone-recovery:
  amount: 1.0
  interval-ticks: 100

light-threshold: 8

disable-beds: true
grace-period: 300

feedback:
  danger-sound: ENTITY_ENDERMAN_STARE
  safety-sound: ENTITY_PLAYER_LEVELUP
  escalation-seconds:
    - 10
    - 30
    - 60

effects:
  delay-ticks: 200
  sun-seeker:
    - WEAKNESS:1
    - SLOWNESS:1
  night-stalker:
    - GLOWING:1
    - WEAKNESS:1

passives:
  sun-seeker:
    - REGENERATION:1
  night-stalker:
    - NIGHT_VISION:1
    - SPEED:1